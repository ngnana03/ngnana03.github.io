<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Finder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1>Recipe Finder</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="favorites.html">Favorites</a>
    </nav>
  </header>

  <main>
    <h2>Perfect place to find your next recipe!!</h2>
    <p>Browse through recipes and find something delicious to make.</p>

    <input type="text" id="searchInput" placeholder="Search recipes...">

    <div class="filters">
      <button>All</button>
      <button>Breakfast</button>
      <button>Lunch</button>
      <button>Dinner</button>
      <button>Dessert</button>
    </div>

    <section id="recipeList">
      <div class="recipe-card">
        <h3>Chilli Cottage Cheese toast</h3>
        <p>Breakfast</p>
      </div>

      <div class="recipe-card">
        <h3>Spicy Vodka Pasta</h3>
        <p>Dinner</p>
      </div>

      <div class="recipe-card">
        <h3>Brownie Batter Cake</h3>
        <p>Dessert</p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
